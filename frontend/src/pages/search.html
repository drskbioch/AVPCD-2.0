      <h1>Search</h1>
      <form class="filters" id="filters">
        <div class="grid">
          <label class="f">Compound name<input type="text" name="compound" maxlength="100" autocomplete="off"></label>
          <label class="f">Plant (species or family)<input type="text" name="plant" maxlength="100" autocomplete="off"></label>
          <label class="f">Virus (as printed, ICTV species or family)<input type="text" name="virus" maxlength="100" autocomplete="off"></label>
        </div>
        <fieldset class="f" style="margin-top:14px"><legend>Endpoint</legend><span id="endpoint-box"></span></fieldset>
        <details class="advanced" id="advanced">
          <summary>Advanced search</summary>
          <div class="grid" style="margin-top:12px">
            <label class="f">InChIKey (full, or first 14 characters)<input type="text" name="inchikey" maxlength="27" autocomplete="off" spellcheck="false"></label>
            <label class="f">Value from (nM)<input type="number" name="value_min" min="0" step="any"></label>
            <label class="f">Value to (nM)<input type="number" name="value_max" min="0" step="any"></label>
            <label class="f">Data quality flag<select name="flag"><option value="">any</option></select></label>
            <label class="f">Rows per page<select name="page_size"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></label>
          </div>
          <fieldset class="f" style="margin-top:14px"><legend>Evidence tier</legend><span id="tier-box"></span></fieldset>
          <p class="hint">The nM filters leave out records whose value could not be converted to nM (mass units without a molecular weight).</p>
        </details>
        <div class="actions">
          <button type="submit" class="btn">Search</button>
          <button type="button" class="btn line" id="reset">Reset</button>
        </div>
      </form>

      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="table-scroll">
        <table>
          <caption class="sr-only">Matching records</caption>
          <thead><tr id="head"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <nav class="pager" aria-label="Pages">
        <button type="button" class="btn line" id="prev">Previous</button>
        <span id="pageinfo"></span>
        <button type="button" class="btn line" id="next">Next</button>
      </nav>
      <p class="hint">Values are shown as recorded in the release; <code>value_nM</code> is derived. Accuracy is known only as a range; see About.</p>
